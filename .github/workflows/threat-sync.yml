name: Scheduled threat source synchronization
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected Schrute Security ingestion endpoint
        env:
          INGESTION_URL: ${{ secrets.INGESTION_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
        run: |
          test -n "$INGESTION_URL"
          test -n "$INGESTION_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$INGESTION_URL/api/ingestion/sync" \
            -H "Authorization: Bearer $INGESTION_SECRET" \
            -H "Content-Type: application/json"
